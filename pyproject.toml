[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "certskip"
version = "0.1.0"
description = "Verified workload-adaptive empty-region certificates for Parquet"
requires-python = ">=3.9"
dependencies = ["datafusion>=43,<44", "pyarrow>=18,<20"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["certskip*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
