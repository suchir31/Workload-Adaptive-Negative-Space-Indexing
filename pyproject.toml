[build-system]
requires = ["setuptools>=61", "wheel", "pybind11>=2.13,<3", "pyarrow==19.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "certskip"
version = "0.3.0"
description = "Verified workload-adaptive empty-region certificates for Parquet"
requires-python = ">=3.9"
dependencies = ["duckdb>=1.1,<2", "pyarrow==19.0.1"]

[project.scripts]
certskip = "certskip.cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<9"]
plot = ["matplotlib>=3.7,<4"]

[tool.setuptools.packages.find]
include = ["certskip*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
